[project]
name = "career-intelligence"
version = "0.1.0"
description = "A lightweight modular AI-powered career intelligence system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.35.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "sqlalchemy>=2.0.29",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "litellm>=1.35.0",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "playwright>=1.44.0",
]

[project.optional-dependencies]
job-extraction = [
    "scrapegraphai>=2.1.1",
]


[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "pre-commit>=3.6.2",
    "types-pyyaml>=6.0.12.20240311",
    "pytest-asyncio>=0.23.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Enable rules for Pyflakes (F), Pycodestyle (E, W), isort (I), pep8-naming (N),
# Pyupgrade (UP), Flake8-bugbear (B), Flake8-builtins (A), Flake8-comprehensions (C4),
# Flake8-pytest-style (PT), Flake8-unused-arguments (ARG), Flake8-use-pathlib (PTH),
# and Ruff-specific rules (RUF)
select = ["E", "F", "I", "W", "C90", "N", "UP", "B", "A", "C4", "PT", "ARG", "PTH", "RUF"]
ignore = [
    "E501",    # line length handled by formatter
    "RUF012",  # mutable class attributes (common in Pydantic/SQLAlchemy models)
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
explicit_package_bases = true
exclude = ["tests/", "migrations/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
